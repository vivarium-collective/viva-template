name: gap-report

# Discovery-engine study-gap report. On every PR that touches the workspace,
# runs the discovery-engine report linter across every study + investigation
# (including ungrouped studies) and posts a gap summary — missing tests, empty
# claims, unverified/overclaimed verdicts, status drift, incomplete narrative —
# as a PR comment plus inline annotations. Report-only by default (warn_only);
# set warn_only: false in a workspace to make blocking gaps fail the PR.
#
# This is a thin caller: all gap->annotation logic lives in the reusable
# discovery-engine composite Action (discovery_engine.integration.ci). Nothing
# workspace-specific here.

on:
  pull_request:
    paths: ['workspace/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  gap-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vivarium-collective/discovery-engine/.github/actions/gap-report@1627d19375e942d587981344695c1137b074c45f
        with:
          workspace: .
          warn_only: true          # report-only: posts summary + annotations, never fails the job
          # strict: 'false'        # promote opt-in warnings to blocking (only when warn_only=false)
          # ruleset: ''            # e.g. 'campaign'
